<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>Control Work — Prioritize tangent</title>
  <style>

    body {
      font-family:'Trebuchet MS', Arial, sans-serif;
      background-color: #ffffff;
      margin: 12px;
      display: flex; 
      flex-direction: column; 
      align-items: center;
    }

    #controls, #canvas-holder, h2 {
        width: fit-content;
    }

    #controls { margin:10px 0; }
    fieldset { display:inline-block; padding:10px; border-radius:7px; border:2px solid #333; }
    label { margin-right:12px; }
    input[type="number"], input[type="range"] { vertical-align: middle; }
    canvas { background-color: rgb(202,113,113); border:1px solid #333; }
    .note { color:#444; font-size:0.9em; margin-top:6px; }
  </style>

  <script src="./Utils/trackball-rotator.js"></script>
  <script src="./Utils/m4.js"></script>
  <script src="./shader.gpu"></script>

  <script src="./Model.js"></script>
  <script src="./main.js"></script>
</head>
<body onload="init()">
 
  <h2>Ding-Dong Surface — Control Work — Prioritize tangent</h2>
 
  <div id="controls">
    <fieldset>
      <legend>Params</legend>
      <label>U resolution:
        <input id="uCount" type="range" min="3" max="80" value="60">
        <input id="uCountNum" type="number" min="3" max="80" value="60" style="width:60px">
      </label>
      <label>V resolution:
        <input id="vCount" type="range" min="3" max="60" value="48">
        <input id="vCountNum" type="number" min="3" max="60" value="48" style="width:60px">
      </label>
      <div class="note">Use sliders or number boxes to change mesh granularity. Light rotates automatically.</div>
    </fieldset>
    <fieldset>
      <legend>Texture Controls</legend>
      <div>
        <label>U coordinate:
          <input id="uPoint" type="range" min="0" max="1" step="0.01" value="0.5">
          <input id="uPointNum" type="number" min="0" max="1" step="0.01" value="0.5" style="width:60px">
        </label>
      </div>
      <div>
        <label>V coordinate:
          <input id="vPoint" type="range" min="0" max="1" step="0.01" value="0.5">
          <input id="vPointNum" type="number" min="0" max="1" step="0.01" value="0.5" style="width:60px">
        </label>
      </div>
      <div>
        <label>Scale:
          <input id="scale" type="range" min="0.1" max="10" step="0.1" value="0.5">
          <input id="scaleNum" type="number" min="0.1" max="10" step="0.1" value="0.5" style="width:60px">
        </label>
      </div>
    </fieldset>
  </div>

  <div id="canvas-holder">
     <canvas width="800" height="600" id="webglcanvas"></canvas>
  </div>

</body>
</html>
