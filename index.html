<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>PA#1</title>
  <style>

    body { 
      font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
      background-color: white;
      justify-items: center;
     }

     button, input{
      font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
      border-radius: 5px;
      border: 2px solid black;
      background-color: white;
      text-align: center;
     }
     button{
        min-width: 130px;
        align-self: center;
     }


  </style>

  <script src="./Utils/trackball-rotator.js"></script>
  <script src="./Utils/m4.js"></script>
  <script src="./shader.gpu"></script>
  <script src="./Model.js"></script>
  <script src="./main.js"></script>

</head>
<body onload="init()">

  <h2>A Cube with "Trackball" Mouse Rotation</h2>

  <p id="message">Drag your mouse on the cube to rotate it.</p>
  <p>Ding-dong surface - variant 15</p>
<div id="controls" style="margin:10px 0;">
  <fieldset style="display:inline-block; 
  padding:8px; border-radius: 7px; 
  border: 2px solid black;">
    <legend>Params</legend>
    <label>uCount: <input id="uCount" type="number" min="4" max="360" value="60" step="1"></label>
    <label>vCount: <input id="vCount" type="number" min="3" max="200" value="48" step="1"></label>
    <br>
  </fieldset>
</div>

  <div id="canvas-holder">
     <canvas width="600" height="600" id="webglcanvas" style="background-color:rgb(202, 113, 113)"></canvas>
  </div>

</body>
</html>
